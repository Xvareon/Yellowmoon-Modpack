##########################################################################################################
# transformations
#--------------------------------------------------------------------------------------------------------#
# Here you have the option to change which pairs of mobs are transformed by transformation powder.
# The format is "modID:mobName-modID:mobName", the same way as you would type it in game if you were to use something like the /summon command, you also have to type a dash in the middle that links mobs.
# You can link as many mobs as you like, let's say you wrote in "minecraft:pig-minecraft:cow-minecraft:chicken". A pig will transform into a cow, a cow into a chicken and a chicken back into a pig.
# You will notice that there are two input slots for mobs, the loop input works as described above, the linear input however, would if provided with the example from above, make it so that the last mob in the link will not be able to transform back into the first mob in the link.
# There are no linear transformations in the "vanilla" Twilight Forest mod, so the input is left empty, the loop input is setup to work as the original developers intended. If you want to undo any changes made to the config, delete this file.
##########################################################################################################

transformations {
    #  [default: ]
    S:"Transformations that are linear: "=ebwizardry:evil_wizard-toroquest:toroquest_mage iceandfire:dread_lich-iceandfire:dread_queen

    #  [default: twilightforest:minotaur-minecraft:zombie_pigman twilightforest:deer-minecraft:cow twilightforest:bighorn_sheep-minecraft:sheep twilightforest:wild_boar-minecraft:pig twilightforest:bunny-minecraft:rabbit twilightforest:tiny_bird-minecraft:parrot twilightforest:raven-minecraft:bat twilightforest:hostile_wolf-minecraft:wolf twilightforest:penguin-minecraft:chicken twilightforest:hedge_spider-minecraft:spider twilightforest:swarm_spider-minecraft:cave_spider twilightforest:wraith-minecraft:blaze twilightforest:redcap-minecraft:villager twilightforest:skeleton_druid-minecraft:witch]
    S:"Transformations that loop: "=twilightforest:minotaur-minecraft:zombie_pigman-fossil:fossil.sentrypigman-primitivemobs:sheepman twilightforest:deer-minecraft:cow-aether_legacy:flying_cow-betteranimalsplus:deer-betteranimalsplus:goat twilightforest:bighorn_sheep-minecraft:sheep-aether_legacy:sheepuff twilightforest:wild_boar-minecraft:pig-aether_legacy:phyg-betteranimalsplus:boar twilightforest:bunny-minecraft:rabbit twilightforest:tiny_bird-notenoughpets:parrot_nep-betteranimalsplus:songbird twilightforest:raven-mod_lavacow:raven twilightforest:hostile_wolf-notenoughpets:wolf_nep-betteranimalsplus:fox-betteranimalsplus:coyote-betteranimalsplus:feralwolf twilightforest:penguin-minecraft:chicken-betteranimalsplus:pheasant-betteranimalsplus:turkey-betteranimalsplus:goose twilightforest:hedge_spider-minecraft:spider-primitivemobs:mother_spider-twilightforest:king_spider twilightforest:swarm_spider-minecraft:cave_spider-primitivemobs:baby_spider minecraft:blaze-ebwizardry:ice_wraith-ebwizardry:lightning_wraith-ebwizardry:shadow_wraith twilightforest:redcap-minecraft:villager twilightforest:skeleton_druid-minecraft:witch-ancientspellcraft:skeleton_mage-tfspellpack:druid_mage twilightforest:squirrel-betteranimalsplus:squirrel minecraft:bat-betteranimalsplus:zotzpyre dungeonsmod:piranha-mod_lavacow:piranha-mod_lavacow:zombiepiranha-mod_lavacow:ghost_swarmer twilightforest:wraith-mod_lavacow:wraith-quark:wraith-charm:spectre-mod_lavacow:avaton-mod_lavacow:banshee-mod_lavacow:sea_hag-ancientbeasts:ghost-ancientbeasts:nekros minecraft:zombie-minecraft:zombie_villager-minecraft:husk-quark:dweller-ancientbeasts:boulderer-ancientbeasts:frost_walker minecraft:skeleton-minecraft:stray-minecraft:wither_skeleton-quark:ashen-quark:pirate-primitivemobs:skeleton_warrior-mod_lavacow:forsaken mod_lavacow:zombiemushroom-mod_lavacow:zombiefrozen-mod_lavacow:mummy-mod_lavacow:unburied minecraft:creeper-primitivemobs:rocket_creeper-primitivemobs:festive_creeper-primitivemobs:support_cre